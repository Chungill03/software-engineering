<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>팀프로젝트 관리</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="calendar.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <div class="layout">
      <header class="top">
        <div class="prototype">프로토타입</div>
      </header>

      <nav class="top_convert">
        <button class="tab_1 active" data-view="board" type="button"></button>
        <button class="tab_2" data-view="calendar" type="button"></button>
        <button class="tab_3" data-view="boardlist" type="button"></button>
      </nav>

      <main class="content">
        <button class="left_button" type="button">‹</button>
        <button class="right_button" type="button">›</button>

        <section class="main_card">
          <!-- TODO 화면 -->
          <section class="view is-active" id="board">
            <h2 class="card_title">팀 진행도 현황</h2>

            <div class="stats">
              <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">전체</div>
              </div>
              <div class="stat-card">
                <div class="stat-number" id="activeCount">0</div>
                <div class="stat-label">진행중</div>
              </div>
              <div class="stat-card">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">완료</div>
              </div>
            </div>

            <div class="todo-input-area">
              <div class="todo-input-wrapper">
                <input
                  type="text"
                  id="todoInput"
                  placeholder="새로운 할 일을 입력하세요"
                />

                <span class="todo-date-icon">📅</span>

                <input type="date" id="todoDate" class="hidden-date-input" />
              </div>

              <button id="addBtn" type="button">추가</button>
            </div>

            <div id="todoList"></div>
          </section>

          <!-- 캘린더 -->
          <section class="view" id="calendar">
            <h2 class="card_title">캘린더</h2>

            <div class="calendar_head">
              <button class="cal_prev" type="button">‹</button>
              <p class="cal_month"></p>
              <button class="cal_next" type="button">›</button>
            </div>

            <ul class="weeks">
              <li>일</li>
              <li>월</li>
              <li>화</li>
              <li>수</li>
              <li>목</li>
              <li>금</li>
              <li>토</li>
            </ul>

            <ul class="days"></ul>
            <div id="calendar_panel" class="calendar_panel">
              <h3 class="calendar-todo-title">날짜를 선택하세요</h3>
              <ul id="calendarTodoList" class="calendar-todo-list"></ul>
            </div>
          </section>

          <!-- 게시판 목록 -->
          <section class="view" id="boardlist">
            <h2 class="card_title">게시판</h2>

            <button
              id="writePostBtn"
              class="add-btn"
              style="margin-bottom: 15px"
              type="button"
            >
              글 작성
            </button>

            <ul class="board-simple" id="boardListContainer"></ul>
          </section>

          <!-- 게시글 작성 화면 -->
          <section class="view" id="post_write">
            <h2 class="card_title">새 게시글 작성</h2>
            <div id="postWriteError" style="display: none; color: red"></div>

            <div class="post-form">
              <input
                type="text"
                id="postTitleInput"
                placeholder="제목"
                class="text-input"
              />
              <textarea
                id="postContentInput"
                placeholder="내용"
                rows="10"
                class="text-area"
              ></textarea>

              <div class="form-actions">
                <button id="submitPostBtn" class="add-btn" type="button">
                  작성 완료
                </button>
                <button id="cancelPostBtn" class="cancel-btn" type="button">
                  취소
                </button>
              </div>
            </div>
          </section>

          <!-- 게시글 상세 화면 -->
          <section class="view" id="post_detail">
            <button id="backToBoardListBtn" class="back-btn" type="button">
              ← 게시판 목록
            </button>

            <h2 class="card_title" id="detailPostTitle"></h2>

            <div class="post-meta">
              <span id="detailPostLikes"></span>
              <button id="likePostBtn" class="like-btn" type="button">
                좋아요
              </button>
            </div>

            <div class="post-content-detail" id="detailPostContent"></div>

            <h3 class="comments-title">댓글</h3>

            <div id="commentsContainer"></div>

            <div class="comment-input-area">
              <textarea
                id="commentInput"
                rows="3"
                placeholder="댓글을 입력하세요"
              ></textarea>
              <button id="addCommentBtn" class="add-btn" type="button">
                댓글 작성
              </button>
            </div>

            <div id="commentError" style="display: none; color: red"></div>
          </section>
        </section>

        <div
          id="errorMessage"
          style="
            display: none;
            color: red;
            padding: 10px;
            background: #fff8f8;
            border: 1px solid red;
            border-radius: 5px;
            max-width: 780px;
            margin: 0 auto 20px;
          "
        ></div>
      </main>
    </div>

    <script src="script.js"></script>
    <script src="calendar.js"></script>
    <script src="board.js"></script>
    <script src="todo.js"></script>
  </body>
</html>
